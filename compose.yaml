services:
  db:
    image: postgres:16-alpine
    container_name: escola-testes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escola_testes
    ports:
      - "5432:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d escola_testes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dados:
